# ============================================================
# test_mn.ini - Этап 1 ТЗ (ТЗ 0.3): минимальная конфигурация LinuxCNC
# проект Powerlink (НИОКР Vanad)
# ------------------------------------------------------------
# [POWERLINK] - параметры моста powerlink.comp (обязательные):
#   CYCLE_NS  = 2000000  (2 мс)
#   NODEID_MN = 240
#   SHM_NAME  = /powerlink
#
# Запуск: linuxcnc test_mn.ini   (головной режим, DISPLAY=none)
# Или через halrun:               halrun -I -f test_mn.hal
# ============================================================

[POWERLINK]
CYCLE_NS = 2000000
NODEID_MN = 240
SHM_NAME = /powerlink

[DISPLAY]
DISPLAY = none

[KINS]
KINEMATICS = trivkins

[TRAJ]
AXES = 0
COORDINATES = XYZ

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 2000000
BASE_PERIOD = 1000000

[HAL]
HALFILE = test_mn.hal

[EMCIO]
EMCIO = io
