# Настройка приёма платежей: Самозанятость (НПД) + Т-Банк Касса
# ========================================================
# После регистрации замените ссылку ниже на вашу платёжную ссылку
# и вставьте её в README.md (секция "Коммерческие услуги").
#
# Юридические ограничения (важно):
#   - Самозанятый (НПД) может оказывать УСЛУГИ: консультации,
#     адаптацию, наладку, поддержку. Лимит дохода — 2,4 млн ₽/год.
#   - Продажа ЛИЦЕНЗИЙ на ПО (двойное коммерческое лицензирование)
#     выходит за рамки НПД и требует ИП/ООО — оформляется отдельным
#     договором, а не через платёжную ссылку самозанятого.
#   - powerlink.comp лицензируется ТОЛЬКО GPLv2 (связывание с
#     GPL-библиотеками LinuxCNC). «Снятие GPL» не предлагается.

